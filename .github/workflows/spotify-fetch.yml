name: spotify-fetch

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '30 1 * * *'
    - cron: '12 3 * * *'
    - cron: '42 4 * * *'
    - cron: '24 6 * * *'
    - cron: '54 7 * * *'
    - cron: '36 9 * * *'
    - cron: '06 11 * * *'
    - cron: '48 12 * * *'
    - cron: '18 14 * * *'
    - cron: '00 16 * * *'
    - cron: '30 17 * * *'
    - cron: '12 19 * * *'
    - cron: '42 20 * * *'
    - cron: '24 22 * * *'
    - cron: '54 23 * * *'
  workflow_dispatch:

concurrency:
  group: spotify-fetch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "Entertainment/Spotify"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Entertainment/Spotify/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run spotify_fetch.py
        env:
          R2_PREFIX: ${{ secrets.SPOTIFY_R2_PREFIX || secrets.R2_PREFIX }}
          R2_HISTORY_PARQUET_KEY: ${{ secrets.R2_HISTORY_PARQUET_KEY }}
          R2_SONGS_PARQUET_KEY: ${{ secrets.R2_SONGS_PARQUET_KEY }}
          R2_ALBUMS_PARQUET_KEY: ${{ secrets.R2_ALBUMS_PARQUET_KEY }}
          R2_ARTISTS_PARQUET_KEY: ${{ secrets.R2_ARTISTS_PARQUET_KEY }}
          SPOTIFY_MAX_PAGES: 2
          R2_BUCKET: ${{ secrets.SPOTIFY_R2_BUCKET || secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.SPOTIFY_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SPOTIFY_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.SPOTIFY_R2_ENDPOINT || secrets.R2_ENDPOINT }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.SPOTIFY_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python spotify_fetch.py
